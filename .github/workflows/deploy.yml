name: Deploy to VPS

on:
  push:
    branches: [main, dev] # <-- 1. Теперь диспетчер слушает обе ветки
  workflow_dispatch:

jobs:
  # ==========================================
  # КОЛЕЯ 1: ТЕСТОВЫЙ СЕРВЕР (Staging)
  # ==========================================
  deploy_staging:
    if: github.ref == 'refs/heads/dev' # <-- Условие: запускать только если это ветка dev
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Staging server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}       # Используем старые секреты
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /root/buh_bot
            git pull origin dev               # <-- Тянем код из ветки dev!
            source venv/bin/activate
            pip install -r requirements.txt
            systemctl restart buhbot

  # ==========================================
  # КОЛЕЯ 2: БОЕВОЙ СЕРВЕР (Production)
  # ==========================================
  deploy_production:
    if: github.ref == 'refs/heads/main' # <-- Условие: запускать только если это ветка main
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Production server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_VPS_HOST }}     # <-- НОВЫЕ секреты для нового сервера
          username: ${{ secrets.PROD_VPS_USER }} 
          key: ${{ secrets.PROD_VPS_SSH_KEY }}  
          port: 22222 
          script: |
            cd /root/buh_bot
            git pull origin main                 # <-- Тянем код из ветки main!
            source venv/bin/activate
            pip install -r requirements.txt
            systemctl restart buhbot